name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 hidapi pyinstaller pillow

      - name: Build AjazzControl.exe
        run: |
          pyinstaller --noconsole --onefile --clean --icon assets\\intellijency.ico --add-data "assets;assets" --name "AjazzControl" main.py
          certutil -hashfile dist\AjazzControl.exe SHA256 > dist\AjazzControl.exe.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist\AjazzControl.exe dist\AjazzControl.exe.sha256 --title "${{ github.ref_name }}" --generate-notes
