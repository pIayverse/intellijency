name: Build and release Intellijency

# Push a tag like v1.2.0 to build the Windows installer and publish it as a GitHub release.
# Installed apps check these releases at startup and update themselves (Velopack).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  VELOPACK_VERSION: '1.2.161'  # keep the vpk tool and the velopack Python package on the same version

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 hidapi openrgb-python "velopack==${{ env.VELOPACK_VERSION }}" pyinstaller

      - name: Version from tag
        id: ver
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then v="0.0.0-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build app folder (PyInstaller onedir, required by Velopack)
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed
          --name Intellijency
          --icon assets\intellijency-logo.ico
          --add-data "assets;assets"
          --add-data "ajazz_app\chevron.svg;ajazz_app"
          --add-data "ajazz_app\check.svg;ajazz_app"
          main.py

      - name: Install vpk
        run: dotnet tool install -g vpk --version ${{ env.VELOPACK_VERSION }}

      - name: Download previous release (for small delta updates)
        continue-on-error: true  # the first release has nothing to download
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack installer
        run: >
          vpk pack --packId Intellijency --packVersion ${{ steps.ver.outputs.version }}
          --packDir dist\Intellijency --mainExe Intellijency.exe
          --icon assets\intellijency-logo.ico --packTitle Intellijency --packAuthors pIayverse

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        run: >
          vpk upload github --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }} --publish
          --releaseName "Intellijency ${{ steps.ver.outputs.version }}" --tag ${{ github.ref_name }}
